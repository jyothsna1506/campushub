spring.application.name=backend

# Server Port (Configurable for deployment environments)
server.port=${PORT:8080}

# MySQL Database Connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campushub}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Joshu@3691}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Settings
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}

# MySQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Configuration (Development default provided; must be overridden in production)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION:${JWT_EXPIRATION_MS:86400000}}

# CORS Configuration (Configurable frontend origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGIN:${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}}

# Admin Bootstrap Configuration (Idempotent seed on startup)
app.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:true}
app.admin.bootstrap.email=${ADMIN_EMAIL:admin@college.edu}
app.admin.bootstrap.password=${ADMIN_PASSWORD:Admin@123}
app.admin.bootstrap.full-name=${ADMIN_FULL_NAME:Campus Administrator}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Multipart File Upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB